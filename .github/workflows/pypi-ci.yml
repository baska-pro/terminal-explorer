name: PyPI packaging CI

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'src/**'
      - 'explorer.sh'
      - 'VERSION'
      - 'tests/**'
      - '.github/workflows/pypi-ci.yml'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'src/**'
      - 'explorer.sh'
      - 'VERSION'
      - 'tests/**'
      - '.github/workflows/pypi-ci.yml'

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate package and original Bash source
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          bash tests/smoke.sh
      - name: Build and inspect distributions
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*
      - name: Install built wheel and verify command aliases
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install --no-index --find-links dist baska-explorer
          "$RUNNER_TEMP/wheel/bin/python" -m pip check
          mkdir -p "$RUNNER_TEMP/sandbox-home"
          HOME="$RUNNER_TEMP/sandbox-home" "$RUNNER_TEMP/wheel/bin/baska-explorer" --version | grep -q 'v3.1.0'
          HOME="$RUNNER_TEMP/sandbox-home" "$RUNNER_TEMP/wheel/bin/terminal-explorer" --help | grep -q 'Usage:'
          HOME="$RUNNER_TEMP/sandbox-home" "$RUNNER_TEMP/wheel/bin/texplorer" --doctor | grep -q 'Required commands:'
