name: Publish BASKA Explorer to PyPI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: baska-explorer-pypi-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release identity and original Bash source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          root = pathlib.Path('.')
          tag = os.environ['RELEASE_TAG']
          with (root / 'pyproject.toml').open('rb') as f:
              version = tomllib.load(f)['project']['version']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Invalid release tag')
          if tag != 'v' + version or version != (root/'VERSION').read_text().strip():
              raise SystemExit('Tag and project version mismatch')
          if f'VERSION="{version}"' not in (root/'explorer.sh').read_text():
              raise SystemExit('Bundled application version mismatch')
          PY
          python -m unittest discover -s tests -p 'test_*.py' -v
          bash tests/smoke.sh

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, inspect and smoke-test wheel
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install --no-index --find-links dist baska-explorer
          mkdir -p "$RUNNER_TEMP/sandbox-home"
          HOME="$RUNNER_TEMP/sandbox-home" "$RUNNER_TEMP/wheel/bin/baska-explorer" --version
      - uses: actions/upload-artifact@v4
        with:
          name: baska-explorer-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/baska-explorer/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: baska-explorer-dist
          path: dist/
      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
