name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Bash syntax
        run: |
          bash -n explorer.sh
          bash -n install.sh
          bash -n uninstall.sh
          bash -n tests/smoke.sh

      - name: Smoke tests
        run: bash tests/smoke.sh

      - name: Offline installer smoke
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          export TERMINAL_EXPLORER_SOURCE="$GITHUB_WORKSPACE/explorer.sh"
          export TE_SKIP_DEPS=1

          bash ./install.sh

          "$HOME/.local/bin/terminal-explorer" --version
          "$HOME/.local/bin/terminal-explorer" --help
          "$HOME/.local/bin/terminal-explorer" --doctor

      - name: Repository hygiene
        run: |
          test ! -e .DS_Store
          if git ls-files | grep -E '(^|/)(dist|build)/|\.sw[op]$|\.bak$'; then
            echo "Generated/editor files are committed." >&2
            exit 1
          fi
